openapi: 3.0.3
info:
  title: Campus Marketplace API
  version: 1.0.0
  description: Baseline contract for hardened API routes.
servers:
  - url: http://localhost:5000
paths:
  /api/products:
    get:
      summary: List active products
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
    post:
      summary: Create a product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/products/{id}:
    get:
      summary: Get product by id
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update mutable product fields (non-status)
      description: Status mutation is handled by `/api/products/{id}/status`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a product
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProductResponse'
  /api/products/{id}/status:
    patch:
      summary: Update product status
      description: Explicit side-effect endpoint for status mutation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/products/{id}/mark-sold:
    post:
      summary: Mark product as sold
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Marked sold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/products/{id}/relist:
    post:
      summary: Relist a sold product
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Relisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/products/{id}/interested:
    post:
      summary: Toggle favorite/interested state
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestedToggleResponse'
  /api/payments/{paymentId}/check:
    get:
      summary: Check payment status with owner/admin scope
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    Product:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        quantity:
          type: integer
        category:
          type: string
        condition:
          type: string
        status:
          type: string
        seller:
          type: object
      required: [_id, title, price, category, condition, seller]
    ProductResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/Product'
      required: [success, data]
    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            totalPages:
              type: integer
      required: [success, data]
    CreateProductRequest:
      type: object
      required: [title, description, price, quantity, category, condition]
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
        quantity:
          type: integer
        category:
          type: string
        condition:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
    UpdateProductRequest:
      type: object
      description: Product field update request. Status is not allowed here.
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
        quantity:
          type: integer
        category:
          type: string
        condition:
          type: string
        images:
          type: array
          items:
            type: string
            format: uri
    UpdateProductStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, HIDDEN]
    InterestedToggleResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        interested:
          type: integer
        isFavorited:
          type: boolean
      required: [success, interested, isFavorited]
    PaymentCheckResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
        message:
          type: string
      required: [success, status, message]
    DeleteProductResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
      required: [success]
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        code:
          type: string
        details:
          oneOf:
            - type: array
            - type: object
